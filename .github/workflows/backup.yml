name: Backup

# 本番の D1 と R2 を 2 週間ごとに取得し、暗号化して Actions のアーティファクトに置く（docs/operations.md）。
# バックアップには全記事とパスワードハッシュが入るので、暗号化しないままは置かない
on:
  schedule:
    # 毎月 2 日と 16 日の 03:30（JST）。cron は UTC で書く（期限切れの掃除 03:00 の後）
    - cron: "30 18 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: パスフレーズがなければ何もしない
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::シークレット BACKUP_PASSPHRASE がありません。暗号化できないので取得しません"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/backup.mjs --remote --out=backup
      - name: 暗号化（平文は消す）
        run: |
          name="komonowa-backup-$(date -u +%Y%m%dT%H%M%SZ)"
          tar -czf - backup | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 -o "$name.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf backup
          echo "NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 90
          if-no-files-found: error
